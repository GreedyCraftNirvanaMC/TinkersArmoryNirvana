plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_name
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

repositories {
    maven { url = 'https://maven.latvian.dev/releases' }
    maven { url = 'https://maven.latvian.dev/mirror' }
}

// 本地依赖由用户提供源码构建，不嵌入运行 JAR，也不在仓库保存第三方二进制。
def tinkersJar = providers.gradleProperty('tinkersNirvanaJar')
        .orElse('../TinkersNirvana-1.21.1/build/libs/TinkersNirvana-1.21.1-1.0.1.jar')
if (!file(tinkersJar.get()).isFile()) {
    throw new GradleException('Build TinkersNirvana first and supply -PtinkersNirvanaJar=/absolute/path/to/TinkersNirvana.jar')
}
def withKubeJS = providers.gradleProperty('withKubeJS').isPresent()
def selfTest = providers.gradleProperty('armorySelfTest').isPresent()

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
            if (selfTest) {
                systemProperty 'conarm.selftest', 'true'
                if (withKubeJS) { systemProperty 'conarm.kubejsFixture', 'true' }
                systemProperty 'conarm.selftestReport', file(withKubeJS
                        ? 'build/reports/armory-selftest-with-kubejs.md'
                        : 'build/reports/armory-selftest-without-kubejs.md').absolutePath
            }
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            jvmArguments.add('-Xmx2G')
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }
dependencies {
    implementation files(tinkersJar.get())
    compileOnly 'dev.latvian.mods:kubejs-neoforge:2101.7.2-build.381'
    compileOnly 'dev.latvian.mods:rhino:2101.2.7-build.81'
    if (withKubeJS) { localRuntime 'dev.latvian.mods:kubejs-neoforge:2101.7.2-build.381' }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var properties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version
    ]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

for (String name : ['jar', 'sourcesJar']) {
    tasks.named(name, Jar) {
        from('LICENSE', 'NOTICE.md', 'TEMPLATE_LICENSE.txt')
        from('licenses') { into 'META-INF/licenses' }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('wrapper', Wrapper).configure { distributionType = Wrapper.DistributionType.BIN }

publishing {
    publications { register('mavenJava', MavenPublication) { from components.java } }
    repositories { maven { url = layout.buildDirectory.dir('repo') } }
}
idea { module { downloadSources = true; downloadJavadoc = true } }
